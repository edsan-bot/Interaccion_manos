    <title>Pintar en el aire</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Pantalla de inicio: el clic habilita cámara y audio -->
    <div id="start-screen">
      <div class="panel">
        <h1>Pintar en el aire</h1>
        <p>
          Dibuja moviendo el dedo índice frente a la cámara. Cada color suena
          con su propia nota de piano.
        </p>
        <button id="start-btn" type="button">Comenzar</button>
      </div>
    </div>

    <!-- Orden obligatorio: p5 → ml5 → sketch.js -->
